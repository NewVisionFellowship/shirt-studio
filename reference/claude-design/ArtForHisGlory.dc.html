<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>For His Glory — artwork</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=UnifrakturMaguntia&amp;family=Mrs+Saint+Delafield&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; background: {{bgFill}}; line-height: 0">
<svg viewBox="0 0 1000 900" style="width: 100%; height: 100%; display: block" role="img" aria-label="For His Glory. Love and truth in action">
<defs>
<clipPath id="fg-weave">
<rect x="190" y="60" width="110" height="720"></rect>
<rect x="640" y="60" width="110" height="720"></rect>
</clipPath>
<g id="fg-black" style="font-family: UnifrakturMaguntia, serif; text-anchor: middle">
<text x="275" y="360" textLength="390" lengthAdjust="spacingAndGlyphs" style="font-size: 290px">For</text>
<text x="725" y="360" textLength="390" lengthAdjust="spacingAndGlyphs" style="font-size: 290px">His</text>
<text x="500" y="700" textLength="820" lengthAdjust="spacingAndGlyphs" style="font-size: 360px">Glory</text>
</g>
<g id="fg-script" style="font-family: 'Mrs Saint Delafield', cursive; text-anchor: middle">
<text x="280" y="372" textLength="380" lengthAdjust="spacingAndGlyphs" transform="rotate(-6 280 290)" style="font-size: 280px">For</text>
<text x="730" y="372" textLength="380" lengthAdjust="spacingAndGlyphs" transform="rotate(-6 730 290)" style="font-size: 280px">His</text>
<text x="505" y="712" textLength="790" lengthAdjust="spacingAndGlyphs" transform="rotate(-6 505 600)" style="font-size: 340px">Glory</text>
</g>
</defs>
<use href="#fg-black" style="fill: {{ink1}}"></use>
<g style="stroke-linejoin: round; stroke-linecap: round">
<use href="#fg-script" style="fill: {{bg}}; stroke: {{bg}}; stroke-width: 18px"></use>
<use href="#fg-script" style="fill: {{ink2}}; stroke: {{ink2}}; stroke-width: 2.5px"></use>
</g>
<g style="clip-path: url(#fg-weave); stroke-linejoin: round">
<use href="#fg-black" style="fill: {{ink1}}; stroke: {{bg}}; stroke-width: 12px; paint-order: stroke"></use>
</g>
<path d="M70 790 C74 818 82 826 110 830 C82 834 74 842 70 870 C66 842 58 834 30 830 C58 826 66 818 70 790 Z" style="fill: {{ink2}}"></path>
<line x1="140" y1="790" x2="960" y2="790" style="stroke: {{ink1}}; stroke-width: 3"></line>
<text x="140" y="852" textLength="820" lengthAdjust="spacing" style="font-family: Archivo, sans-serif; font-weight: 700; font-stretch: 112%; font-size: 36px; fill: {{ink1}}">LOVE &amp; TRUTH IN ACTION</text>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink1":{"editor":"color","default":"#eee3c8","options":["#eee3c8","#ffffff","#bdb9b2","#24201d"]},"ink2":{"editor":"color","default":"#b3852b","options":["#b3852b","#74ca33","#5f9a32","#ffffff"]},"bg":{"editor":"color","default":"#35493b","options":["#35493b","#5b2c35","#232b40","#1c1c1e"]},"showBg":{"editor":"boolean","default":true},"w":{"editor":"int","default":1000,"min":100,"max":4000},"$preview":{"width":1000,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1000);
    const bg = this.props.bg ?? '#35493b';
    const showBg = this.props.showBg ?? true;
    return { w, h: w * 0.9, ink1: this.props.ink1 ?? '#eee3c8', ink2: this.props.ink2 ?? '#b3852b', bg, bgFill: showBg ? bg : 'transparent' };
  }
}
</script>
</body>
</html>
