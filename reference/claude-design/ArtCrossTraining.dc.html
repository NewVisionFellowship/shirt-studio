<mask id="ct-m" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="980">
<rect width="1000" height="980" style="fill: #fff"></rect>
<rect width="1000" height="980" style="filter: url(#ct-n); opacity: {{dOp}}"></rect>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink1":{"editor":"color","default":"#bdb9b2","options":["#bdb9b2","#ffffff","#eee3c8","#24201d"]},"ink2":{"editor":"color","default":"#74ca33","options":["#74ca33","#5f9a32","#ffffff","#b3852b"]},"bg":{"editor":"color","default":"#1c1c1e","options":["#1c1c1e","#232b40","#a3a3a1","#35493b"]},"showBg":{"editor":"boolean","default":true},"distress":{"editor":"boolean","default":true},"w":{"editor":"int","default":1000,"min":100,"max":4000},"$preview":{"width":1000,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1000), s = w / 1000;
    const bg = this.props.bg ?? '#1c1c1e';
    const showBg = this.props.showBg ?? true;
    return { w, h: w * 0.98, ink1: this.props.ink1 ?? '#bdb9b2', ink2: this.props.ink2 ?? '#74ca33', bg, bgFill: showBg ? bg : 'transparent', dOp: (this.props.distress ?? true) ? 1 : 0, lx: 0, ly: -66 * s, lw: w, lh: w + 'px,' + w + 'px' };
  }
}
</script>
