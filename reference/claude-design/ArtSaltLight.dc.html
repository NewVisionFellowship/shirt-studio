<script type="text/x-dc" data-dc-script data-props='{"ink1":{"editor":"color","default":"#b3852b","options":["#b3852b","#eee3c8","#ffffff","#24201d"]},"ink2":{"editor":"color","default":"#eee3c8","options":["#eee3c8","#b3852b","#ffffff","#5f9a32"]},"bg":{"editor":"color","default":"#35493b","options":["#35493b","#232b40","#1c1c1e","#a3a3a1"]},"showBg":{"editor":"boolean","default":true},"w":{"editor":"int","default":1000,"min":100,"max":4000},"$preview":{"width":1000,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1000);
    const bg = this.props.bg ?? '#35493b';
    const showBg = this.props.showBg ?? true;
    return { w, h: w, ink1: this.props.ink1 ?? '#b3852b', ink2: this.props.ink2 ?? '#eee3c8', bg, bgFill: showBg ? bg : 'transparent', lh: w + 'px,' + w + 'px' };

}
</script>
