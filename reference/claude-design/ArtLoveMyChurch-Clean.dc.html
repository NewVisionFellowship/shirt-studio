<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I Love My Church — artwork (clean)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@font-face{font-family:"Nexa Clean";src:url(/_blob/2683236d4a0d49dbc7a3eb5263a9d0e2) format("truetype");font-display:block}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; background: {{bgFill}}; line-height: 0; position: relative">
<svg viewBox="0 0 1000 965" style="width: 100%; height: 100%; display: block" role="img" aria-label="I love my church, and we love our neighbors">
<defs>

</defs>
<g>
<path d="M50 90 C20 70 0 52 0 28 C0 12 12 0 27 0 C37 0 45 6 50 14 C55 6 63 0 73 0 C88 0 100 12 100 28 C100 52 80 70 50 90 Z" transform="translate(120 98) scale(7.6)" style="fill: {{ink2}}"></path>
<g style="fill: {{ink1}}; stroke: {{bg}}; stroke-width: 14px; paint-order: stroke; stroke-linejoin: round">
<text x="{{iX}}" y="{{iY}}" style="font-family: Archivo, sans-serif; font-weight: 500; font-size: {{iS}}px">I</text>
<text x="500" y="{{chY}}" textLength="880" lengthAdjust="spacingAndGlyphs" style="font-family: Archivo, sans-serif; font-weight: 900; font-size: {{chS}}px; text-anchor: middle">CHURCH</text>
</g>
<text x="500" y="872" textLength="880" lengthAdjust="spacingAndGlyphs" style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 66px; text-anchor: middle"><tspan style="fill: {{ink1}}">&amp; </tspan><tspan style="fill: {{ink2}}">WE LOVE OUR NEIGHBORS</tspan></text>
</g>
<defs>
<g id="lc-script" style="font-family: 'Nexa Clean', cursive">
<text x="{{lX}}" y="{{base}}" style="font-size: {{lS}}px">L</text>
<text x="0" y="0" transform="translate({{oX}} {{base}}) scale({{oC}} 1)" style="font-size: {{oS}}px">ove</text>
<text x="{{myX}}" y="{{myY}}" style="font-size: {{myS}}px">My</text>
</g>
</defs>
<use href="#lc-script" style="fill: {{bg}}; stroke: {{bg}}; stroke-width: 14px; stroke-linejoin: round"></use>
<use href="#lc-script" style="fill: {{ink1}}; stroke: none"></use>
</svg>
<div style="position: absolute; left: {{lx}}px; top: {{ly}}px">
<dc-import name="Logo" layout="horizontal" w="{{lw}}" c1="{{ink1}}" c2="{{ink2}}" hint-size="{{lh}}"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink1":{"editor":"color","default":"#ffffff","options":["#ffffff","#eee3c8","#bdb9b2","#24201d"]},"ink2":{"editor":"color","default":"#ae5230","options":["#ae5230","#5f9a32","#b3852b","#74ca33"]},"bg":{"editor":"color","default":"#1c1c1e","options":["#1c1c1e","#35493b","#232b40","#5b2c35"]},"showBg":{"editor":"boolean","default":true},"w":{"editor":"int","default":1000,"min":100,"max":4000},"$preview":{"width":1000,"height":965}}'>
class Component extends DCLogic {
  renderVals() {
    const w = Number(this.props.w ?? 1000), s = w / 1000, lw = 528 * s;
    const bg = this.props.bg ?? '#1c1c1e';
    const showBg = this.props.showBg ?? true;
    return { w, h: w * 0.965, lx: 236 * s, ly: 937 * s, lw, lh: lw + 'px,' + (lw * 75 / 1626) + 'px', ink1: this.props.ink1 ?? '#ffffff', ink2: this.props.ink2 ?? '#ae5230', bg, bgFill: showBg ? bg : 'transparent', iX: 95, iY: 274, iS: 305, lX: 127, lS: 520, base: 425, oX: 413, oS: 480, oC: 0.806, myX: 555, myY: 550, myS: 150, chY: 762, chS: 220 };
  }
}
</script>
</body>
</html>
