<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["stacked","horizontal","arc"],"default":"stacked"},"c1":{"editor":"color","default":"#24201d","options":["#24201d","#ffffff","#eee3c8","#5f9a32"]},"c2":{"editor":"color","default":"#5f9a32","options":["#5f9a32","#74ca33","#b3852b","#ffffff"]},"w":{"editor":"int","default":900,"min":20,"max":4000},"arcR":{"editor":"int","default":372,"min":120,"max":480},"arcK":{"editor":"float","default":0.6,"min":0.2,"max":1.2,"step":0.01},"arcSpread":{"editor":"float","default":1,"min":1,"max":2,"step":0.05},"$preview":{"width":900,"height":372}}'>
class Component extends DCLogic {

    // Stacked lockup positions: [x, y, h]; 21-24 = cross pieces (drawn at native size)
    const S = [[65.7,196.6,35.4],[103.6,196.6,35.4],[142.6,196.6,35.4],[179.9,196.6,35.4],[217.1,196.6,35.4],[258.8,196.6,35.4],[318.3,196.6,35.4],[360.1,196.6,35.4],[400.8,196.6,35.4],[415.5,196.6,35.4],[133.8,34.7,72.5],[224.8,34.7,72.5],[301.2,34.7,72.5],[26.1,114,72.5],[127.6,114,72.5],[156.5,114,72.5],[244.3,114,72.5],[274.8,114,72.5],[370.5,114,72.5],[0,0,101],[65.4,54.5,47.2],[429.8,72.8],[429.3,4.8],[501.1,4.8],[500.9,72.8]];
    const layout = this.props.layout ?? 'stacked';
    const w = Number(this.props.w ?? 900);
    const c1 = this.props.c1 ?? '#24201d';
    const c2 = this.props.c2 ?? '#5f9a32';
    const t = {}, f = {};
    let vb, h;
    for (let i = 0; i < 25; i++) {
      const k = 'g' + i;
      f[k] = (i >= 10 && i <= 18) ? c1 : c2;
      if (layout === 'stacked') {
        const p = S[i];
        t[k] = i > 20 ? `translate(${p[0]} ${p[1]})` : `translate(${p[0]} ${p[1]}) scale(${(p[2] / H[i][3]).toFixed(4)})`;
      } else if (i > 20) {
        t[k] = 'scale(0)';
        f[k] = 'none';
      } else if (layout === 'horizontal') {
        t[k] = `translate(${H[i][0]} ${H[i][1]})`;
      } else {
        const r = Number(this.props.arcR ?? 372), sc = Number(this.props.arcK ?? 0.6);
        const g = H[i];
        const sp = Number(this.props.arcSpread ?? 1);
        // The leaf mark (pieces 19 and 20) is placed as one rigid unit so the brand mark stays intact.
        const leaf = i === 19 || i === 20;
        const cx = leaf ? 346.5 : g[0] + g[2] / 2;
        const s = (cx - 812.7) * sc * sp;
        const deg = (s / r) * 180 / Math.PI;
        t[k] = `rotate(${deg.toFixed(3)}) translate(0 ${-r}) scale(${sc}) translate(${(leaf ? g[0] - cx : -g[2] / 2).toFixed(1)} ${(g[1] - 73.9).toFixed(1)})`;
      }
    }
    if (layout === 'stacked') { vb = '0 0 564 233'; h = w * 233 / 564; }
    else if (layout === 'horizontal') { vb = '0 0 1626 75'; h = w * 75 / 1626; }
    else { vb = '-500 -500 1000 1000'; h = w; }
    return { t, f, vb, w, h };
  }
